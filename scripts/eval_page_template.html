<!doctype html>
<html><head><meta charset="utf-8"><title>sevBench: eval data and multi-model predictions</title>
<style>
 body{background:#101418;color:#d7dde3;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0;padding:1.5rem}
 main{max-width:1100px;margin:0 auto}
 h1{font-size:1.15rem}h2{font-size:1rem;color:#8296a5}
 table{width:100%;border-collapse:collapse;margin:.8rem 0;font-size:13px}
 th,td{padding:.4rem .6rem;border-bottom:1px solid #232b33;text-align:left;vertical-align:top}
 .m{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ok{color:#5fd3a1}.bad{color:#e07a7a}.neu{color:#ecc45f}
 .tabs button{background:#232b33;color:#d7dde3;border:1px solid #3a4550;border-radius:6px;
   padding:.5rem 1rem;margin:.2rem;cursor:pointer;font:inherit}
 .tabs button.on{background:#3a4550}
 input{background:#161b21;color:#d7dde3;border:1px solid #3a4550;border-radius:6px;padding:.5rem;font:inherit;width:300px}
 label{margin-left:1rem;cursor:pointer}
 .chip{padding:.1rem .5rem;border-radius:999px;font-size:.72rem}
 .u{background:#14352a;color:#5fd3a1}
 .n{background:#3a2f14;color:#ecc45f}
</style></head><body><main>
<h1>sevBench — eval data and multi-model predictions</h1>
<p class="neu">All rows are held-out splits, native Malay, scored against the same teacher column.
Sentiment/emotion/toxic bars from malaya: 0.994 / 0.998 / 0.818 (in-distribution; their shipped model audits at 0.515 on our pool — see the audit tab).</p>
<div class="tabs">
 <button class="on" data-t="sentiment">sentiment (1600)</button>
 <button data-t="emotion">emotion (500)</button>
 <button data-t="toxic">toxic (500)</button>
 <button data-t="gold">ensemble gold (299)</button>
 <button data-t="audit">malaya audit</button>
</div>
<p><input id="q" placeholder="search text…"> <label><input type="checkbox" id="wrong" checked> show wrong only</label></p>
<div id="out"></div>
<script>
const D=__DATA__;
let tab="sentiment", q="", wrongOnly=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chip(v,gold){const cls=v===gold?"ok":"bad";return `<span class="${cls}">${esc(v??"—")}</span>`;}
function taskRows(){
  const t=D.tasks[tab];const f=t.models;
  let rows=t.rows.filter(r=>(!wrongOnly||!r.models_agree)&&(!q||r.text.toLowerCase().includes(q)));
  const head=`<tr><th>id</th><th class="m">text</th><th>gold</th>${f.map(m=>`<th>${m}</th>`).join("")}</tr>`;
  const body=rows.slice(0,300).map(r=>`<tr><td>${r.id}</td><td class="m" title="${esc(r.text)}">${esc(r.text)}</td><td>${esc(r.gold)}</td>${f.map(m=>`<td>${chip(r[m],r.gold)}</td>`).join("")}</tr>`).join("");
  return `<table>${head}${body}</table><p class="neu">showing ${Math.min(rows.length,300)} of ${rows.length} matching rows</p>`;
}
function goldRows(){
  let rows=D.gold.filter(r=>(!wrongOnly||!r.unanimous)&&(!q||r.text.toLowerCase().includes(q)));
  const head=`<tr><th>sheet</th><th>#</th><th class="m">text</th><th>fable</th><th>nox</th><th>vega</th><th>codex</th><th>ensemble</th><th></th></tr>`;
  const body=rows.slice(0,300).map(r=>{
    const L=r.labelers;
    const cell=k=>chip((L[k]&&Object.values(L[k])[0])||"");
    const ens=Object.values(r.ensemble||{})[0]||"—";
    const badge=r.unanimous?'<span class="chip u">unanimous</span>':'<span class="chip n">majority</span>';
    return `<tr><td>${esc(r.sheet)}</td><td>${r.row_id}</td><td class="m" title="${esc(r.text)}">${esc(r.text)}</td><td>${cell("fable")}</td><td>${cell("nox")}</td><td>${cell("vega")}</td><td>${cell("codex")}</td><td>${chip(ens)}</td><td>${badge}</td></tr>`;}).join("");
  return `<table>${head}${body}</table><p class="neu">showing ${Math.min(rows.length,300)} of ${rows.length}</p>`;
}
function auditRows(){
  const a=D.audit;return `<table><tr><th></th><th>value</th></tr>
  <tr><td>audited model</td><td>${esc(a.model)}</td></tr>
  <tr><td>sanity probes</td><td>${a.sanity_probes.hits}/${a.sanity_probes.n}</td></tr>
  <tr><td>accuracy vs our teacher (200 rows)</td><td>${a.eval_split.accuracy_vs_teacher}</td></tr>
  <tr><td>Nox zero-shot (same rows context)</td><td>0.766</td></tr>
  <tr><td>our fine-tuned</td><td>0.876</td></tr>
  <tr><td>published chart claim</td><td>0.99353 (in-distribution)</td></tr></table>
  <p>Both negation-probe failures: ${a.sanity_probes.rows.filter(r=>!r.match).map(r=>esc(r.text)).join(" | ")}</p>`;
}
function render(){
  const o=document.getElementById("out");
  if(tab==="gold")o.innerHTML=goldRows();
  else if(tab==="audit")o.innerHTML=auditRows();
  else o.innerHTML=taskRows();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");tab=b.dataset.t;render();});
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase();render();};
document.getElementById("wrong").onchange=e=>{wrongOnly=e.target.checked;render();};
render();
</script></body></html>
